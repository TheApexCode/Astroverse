<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="planetGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="75%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Constellation guide lines -->
  <g stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3,3">
    <line x1="80" y1="120" x2="160" y2="90" />
    <line x1="160" y1="90" x2="220" y2="150" />
    <line x1="220" y1="150" x2="310" y2="110" />
    <line x1="380" y1="360" x2="430" y2="420" />
    <line x1="120" y1="390" x2="170" y2="440" />
  </g>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="120" r="3.5" opacity="0.9" />
    <circle cx="160" cy="90" r="4" opacity="0.95" />
    <circle cx="220" cy="150" r="3" opacity="0.8" />
    <circle cx="310" cy="110" r="4.5" opacity="1" filter="url(#glow)" />
    <circle cx="410" cy="140" r="2.5" opacity="0.7" />
    <circle cx="380" cy="360" r="3.5" opacity="0.85" />
    <circle cx="430" cy="420" r="4" opacity="0.9" />
    <circle cx="120" cy="390" r="3" opacity="0.75" />
    <circle cx="170" cy="440" r="3.5" opacity="0.8" />
    <circle cx="95" cy="260" r="2" opacity="0.6" />
    <circle cx="440" cy="240" r="2" opacity="0.6" />
  </g>

  <!-- Celestial Coordinate Reticle rings -->
  <circle cx="256" cy="256" r="190" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" fill="none" stroke-dasharray="4,8" />
  <circle cx="256" cy="256" r="140" stroke="#818cf8" stroke-width="1" stroke-opacity="0.25" fill="none" />

  <!-- Back of Ring -->
  <g transform="rotate(-26 256 256)">
    <ellipse cx="256" cy="256" rx="190" ry="46" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-dasharray="320 280" stroke-dashoffset="0" opacity="0.7" filter="url(#glow)" />
  </g>

  <!-- Central Planet -->
  <circle cx="256" cy="256" r="92" fill="url(#planetGrad)" filter="url(#glow)" />

  <!-- Atmospheric rim -->
  <circle cx="256" cy="256" r="92" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.6" />

  <!-- Front of Ring -->
  <g transform="rotate(-26 256 256)">
    <ellipse cx="256" cy="256" rx="190" ry="46" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-dasharray="280 320" stroke-dashoffset="280" opacity="0.95" filter="url(#glow)" />
    <ellipse cx="256" cy="256" rx="165" ry="38" fill="none" stroke="#e0e7ff" stroke-width="2" stroke-dasharray="240 280" stroke-dashoffset="240" opacity="0.8" />
  </g>

  <!-- Little orbiting moon -->
  <circle cx="370" cy="205" r="8" fill="#e0e7ff" filter="url(#glow)" />
</svg>
